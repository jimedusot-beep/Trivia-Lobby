name: Repair dependency lockfile
on:
  push:
    branches: [fix/security-and-multiplayer-2026-10]
    paths: [.github/workflows/audit-lock-repair.yml]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update vulnerable production dependency and compatible lock entries
        run: |
          npm install drizzle-orm@0.45.2 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Commit only verified lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update Drizzle and fix compatible vulnerable lock entries"
            git push origin HEAD:fix/security-and-multiplayer-2026-10
          fi
