name: Free Render and Neon deployment configuration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build in Render production environment
        env:
          NODE_ENV: production
        run: |
          npm ci --include=dev
          npm run build
          test -f dist/start.mjs
          test -f dist/index.cjs
      - name: Verify free single-instance Render/Neon Blueprint
        run: |
          ruby <<'RUBY'
          require "yaml"
          source=File.read("render.yaml")
          config=YAML.safe_load(source, aliases: false)
          services=config.fetch("services")
          raise "Only one free web service should exist" unless services.size==1
          raise "No billable PostgreSQL resources allowed" if config.key?("databases") && !config["databases"].empty?
          raise "No standalone workers/cron/paid services allowed" unless services.all?{|s| s["type"]=="web" && s["runtime"]=="node" && s["plan"]=="free"}
          web=services.first
          raise "Disable auto-deploy to avoid surprise migrations" unless web["autoDeployTrigger"]=="off"
          raise "Live game authority requires one instance" unless web["numInstances"]==1
          raise "Free web service cannot mount a persistent disk" if web.key?("disk")
          raise "Use database-backed readiness checks" unless web["healthCheckPath"]=="/health/ready"
          raise "Use the tested build/start commands" unless web["buildCommand"]=="npm ci --include=dev && npm run build" && web["startCommand"]=="npm start"
          vars=web.fetch("envVars").to_h{|env| [env.fetch("key"),env]}
          secrets=%w[DATABASE_URL DATABASE_URL_UNPOOLED AWS_ENDPOINT_URL_S3 AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY]
          raise "All Neon credentials/bucket values must be supplied privately" unless secrets.all?{|key| vars[key]=={"key"=>key,"sync"=>false}}
          raise "Do not rely on ephemeral disk" if vars.key?("PRIVATE_STORAGE_DIR")
          raise "Use HTTPS S3 path addressing" unless vars.dig("S3_FORCE_PATH_STYLE","value")=="true"
          raise "Expose only the Render HTTP port" unless vars.dig("PORT","value")=="10000"
          raise "Require production Node >=22" unless vars.dig("NODE_ENV","value")=="production" && vars.key?("NODE_VERSION")
          raise "No embedded credentials" if source.match?(/(?:password|access_key_id|secret_access_key|api_token)\s*:\s*[^\n\s]/i)
          puts "Free-tier blueprint verified: one Render Free web service, no paid resources, no ephemeral uploads, six Neon variables prompted privately"
          RUBY
