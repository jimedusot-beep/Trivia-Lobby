name: Encrypted recovery backup
on:
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * *'
permissions:
  contents: read
jobs:
  backup:
    # Explicit operator enablement after secrets, bucket policy and restore rehearsal.
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SOURCE_STORAGE_BACKEND: s3
      SOURCE_S3_BUCKET: ${{ secrets.SOURCE_S3_BUCKET }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Create encrypted snapshot and upload to private recovery bucket
        run: node --import tsx script/backup.ts create /tmp/trivia-backup.enc
      - name: Remove temporary encrypted artifact
        if: always()
        run: rm -f /tmp/trivia-backup.enc
