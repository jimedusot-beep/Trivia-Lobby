name: Guest party engine
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/guest-party-engine]
concurrency:
  group: party-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  engine-and-browsers:
    name: guest-browsers (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PARTY_CROSS_BROWSER: '1'
    defaults:
      run:
        working-directory: examples/party-engine
    steps:
      # Automated gameplay checks use current source only. Historical comparison
      # screenshots are an explicit manual task (capture-tv-catalog-baseline.mjs).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/party-engine/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Install guest browsers with bounded mirror retries
        timeout-minutes: 7
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-trivia-ci-network >/dev/null
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
        env:
          RACE_SCREENSHOT_DIR: test-results/grand-prix-preview
      # Save the actual responsive game-cover screenshots even when the
      # browser suite passes; visual review is a separate release gate.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-console-cover-shelf-${{ matrix.browser }}
          path: |
            examples/party-engine/test-results/gx2-catalog-*.png
            examples/party-engine/test-results/gx2-tv-lobby.png
            examples/party-engine/test-results/tv-preview-visible.png
            examples/party-engine/test-results/switch-cover-shelf-mobile.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-preview-${{ matrix.browser }}
          path: examples/party-engine/test-results/grand-prix-preview/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: party-engine-browser-failure-${{ matrix.browser }}
          path: examples/party-engine/test-results/
          retention-days: 7
