name: Browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "migrations/**"
      - ".github/workflows/phase2-e2e.yml"
jobs:
  visual-exam:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trivia_e2e
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trivia -d trivia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trivia:trivia@127.0.0.1:5432/trivia_e2e
      PORT: "5000"
      BASE_URL: http://127.0.0.1:5000
      PRIVATE_STORAGE_DIR: /tmp/trivia-browser-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:push
      - run: npm run db:migrate
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start development web server
        run: |
          npm run dev >/tmp/trivia-e2e-server.log 2>&1 &
          echo $! >/tmp/trivia-e2e-server.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/trivia-e2e-server.log
          exit 1
      - name: Browser creation, persistence, mobile and scoring
        run: npm run test:e2e -- --project=${{ matrix.browser }} --reporter=line
      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/trivia-e2e-server.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
