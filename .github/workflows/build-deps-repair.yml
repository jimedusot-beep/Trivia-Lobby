name: Move build-only styles to dev dependencies
on:
  push:
    branches: [fix/security-and-multiplayer-2026-10]
    paths: [.github/workflows/build-deps-repair.yml]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Mark Tailwind animation plugin as build-only
        run: |
          npm install --save-dev tailwindcss-animate@^1.0.7 --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: classify build-only Tailwind animation plugin as dev dependency"
            git push origin HEAD:fix/security-and-multiplayer-2026-10
          fi
