name: One-time live mobile build verification
on:
  push:
    branches:
      - ops/check-live-mobile-build-20261025
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SMOKE_URL: https://trivia-lobby.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify public health and socket safeguards
        run: npm run smoke
      - name: Inspect live frontend asset and public cache headers
        run: |
          set -euo pipefail
          for u in "$SMOKE_URL/" "$SMOKE_URL/?asset-probe=0341181653c0"; do
            curl -fsS --max-time 90 -H 'Cache-Control: no-cache' -D /tmp/trivia-headers -o /tmp/trivia-home.html "$u"
            echo "Public URL: $u"
            grep -Ei '^(cache-control|age|etag|cf-cache-status|last-modified|x-render-):' /tmp/trivia-headers || true
            grep -Eo 'index-[a-zA-Z0-9_-]+\.js' /tmp/trivia-home.html || true
            if grep -q 'index-BU5xsjui.js' /tmp/trivia-home.html; then
              echo 'Verified route-split public frontend is live'
              exit 0
            fi
          done
          echo 'Frontend still serving a different script fingerprint'
          exit 1
