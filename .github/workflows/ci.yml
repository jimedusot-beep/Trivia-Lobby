name: CI
on:
  push:
    branches: [main, feature/unify-trivia-and-file-import]
  pull_request:
    branches: [main]
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run test
      - run: npm run build
