name: CI
on:
  push:
    branches: [main, feature/unify-trivia-and-file-import, fix/phase1-secure-multiplayer-2026-10-21]
  pull_request:
    branches: [main]
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia_ci_only
          POSTGRES_DB: trivia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trivia -d trivia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trivia:trivia_ci_only@127.0.0.1:5432/trivia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
