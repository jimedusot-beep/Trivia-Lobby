name: Local WebSocket load evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: websocket-load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured-single-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify bounded racing probe metrics
        run: python3 -B -m unittest discover -s tests -p test_racing_probe.py
      - name: Measure 10, 25, 50 and 100 local simulated clients
        shell: bash
        run: |
          set -o pipefail
          node --import tsx script/load-live.ts 10 25 50 100 | tee load-results.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-websocket-load-results
          path: load-results.ndjson
          if-no-files-found: ignore
