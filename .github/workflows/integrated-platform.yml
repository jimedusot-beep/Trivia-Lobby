name: Integrated platform acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trivia_production_ci
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trivia -d trivia_production_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRODUCTION_TEST_DATABASE_URL: postgresql://trivia:trivia_ci_only@127.0.0.1:5432/trivia_production_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Remove all development dependencies from the runtime
        run: npm prune --omit=dev
      - name: Boot built artifacts, migrate an empty database, play and restart
        run: npm run test:production
  cancel-obsolete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head.ref ?? context.ref.replace('refs/heads/', '');
            const head = context.payload.pull_request?.head.sha ?? context.sha;
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, branch, per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId && run.name === context.workflow &&
                  run.head_branch === branch && run.head_sha !== head &&
                  ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)) {
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                  core.info(`Cancelled obsolete acceptance run ${run.id}`);
                } catch (error) {
                  core.warning(`Could not cancel obsolete run ${run.id}: HTTP ${error.status ?? 'unknown'}`);
                }
              }
            }
  postgres-and-browsers:
    needs: cancel-obsolete-runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trivia_ci
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trivia -d trivia_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trivia:trivia_ci_only@127.0.0.1:5432/trivia_ci
      TEST_DATABASE_URL: postgresql://trivia:trivia_ci_only@127.0.0.1:5432/trivia_ci
      STUDY_TEST_DATABASE_URL: postgresql://trivia:trivia_ci_only@127.0.0.1:5432/trivia_ci
      PRIVATE_STORAGE_DIR: /tmp/trivia-ci-originals
      PORT: '5000'
      BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - name: Verify migrations can be repeated
        run: npm run db:migrate
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Database backup and empty-database restore rehearsal
        run: |
          npm run backup:db
          createdb -h 127.0.0.1 -U trivia trivia_restore
          export BACKUP_FILE=$(find /tmp/trivia-backups -name '*.dump' | head -1)
          npm run restore:db
        env:
          BACKUP_DIR: /tmp/trivia-backups
          RESTORE_DATABASE_URL: postgresql://trivia:trivia_ci_only@127.0.0.1:5432/trivia_restore
          ALLOW_EMPTY_RESTORE: 'yes'
          PGPASSWORD: trivia_ci_only
      - name: Encrypted database and exact original-file recovery drill
        run: npm run backup:drill
      - name: Install selected browser
        timeout-minutes: 7
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-trivia-ci-network >/dev/null
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start application and smoke test
        run: |
          npm run dev >/tmp/trivia-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:5000/health/ready; then break; fi
            sleep 2
          done
          npm run smoke
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            /tmp/trivia-server.log
