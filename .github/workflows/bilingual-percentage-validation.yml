name: Bilingual Percentage validation
on:
  pull_request:
    branches: [main, feature/bilingual-party-en-es-20261102]
    paths:
      - 'examples/party-engine/**'
      - '.github/workflows/bilingual-validation.yml'
permissions:
  contents: read
concurrency:
  group: bilingual-percentage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bilingual-node:
    name: percentage-node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: examples/party-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/party-engine/package-lock.json
      - run: npm ci
      - run: npm test
  bilingual-browser:
    name: percentage-browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PARTY_CROSS_BROWSER: '1'
    defaults:
      run:
        working-directory: examples/party-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/party-engine/package-lock.json
      - run: npm ci
      - name: Install selected browser
        timeout-minutes: 7
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-trivia-ci-network >/dev/null
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Mixed-language Percentage and shared controller tests
        run: npm run test:browser -- browser-specs/bilingual.spec.js browser-specs/bilingual-tv.spec.js browser-specs/bilingual-percentage.spec.js --project=${{ matrix.browser }} --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bilingual-percentage-failure-${{ matrix.browser }}
          path: examples/party-engine/test-results/
          retention-days: 7
