<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice my quiz · Trivia Lobby</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./create.css" />
  <link rel="icon" type="image/svg+xml" href="./lobby-spark.svg" />
  <script src="./practice.js" type="module"></script>
</head>
<body class="public-practice">
<main>
  <header>
    <nav class="page-nav" aria-label="Practice navigation"><a class="lobby-brand" href="/" aria-label="Trivia Lobby home"><img src="./lobby-spark.svg" alt="" width="46" height="46" /><span class="lobby-wordmark">Trivia<span>Lobby</span></span></a><div class="page-nav-links"><a href="./create.html">My quizzes</a><a href="./learn.html">My courses</a></div></nav>
    <span class="lobby-kicker">You’ve got this.</span>
    <h1 id="title">Practice my quiz</h1>
    <p>No account required. This is self-paced practice on your current device.</p>
  </header>
  <p id="status" role="status" aria-live="polite">Loading quiz from this device…</p>
  <section id="lesson" hidden aria-label="Practice questions">
    <p id="progress"></p>
    <h2 id="prompt" tabindex="-1"></h2>
    <div id="choices"></div>
    <section id="feedback" aria-live="polite" hidden>
      <h3 id="result"></h3>
      <p id="explanation"></p>
      <button id="next">Next question</button>
    </section>
  </section>
  <section id="completed" hidden aria-label="Practice results">
    <h2>Practice complete</h2>
    <p id="score"></p>
    <button id="again">Try again</button>
    <p><a id="edit" href="./create.html">Edit this quiz</a> · <a id="learn" href="./learn.html">Learn as a course</a> · <a href="./">Host a guest party</a></p>
  </section>
</main>
</body>
</html>
